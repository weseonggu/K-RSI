spring:
  datasource-data:
    # 비밀번호는 환경변수로만 주입 (.env.example 참고). 값이 없으면 기동 시 즉시 실패한다.
    password: ${RSI_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 도커 배포 시 호스트는 compose 서비스명(mysql-data)으로 해석된다
    jdbc-url: jdbc:mysql://${RSI_DATA_DB_HOST:mysql-data}:${RSI_DATA_DB_PORT:3306}/RSIData?rewriteBatchedStatements=true
    username: ${RSI_DB_USERNAME:dnltjdrn}
    # HikariCP 커넥션 풀 — 코드 하드코딩 대신 여기서 조정(재배포 없이 환경변수로도 변경 가능).
    # KOSPI/KOSDAQ 자식 Job이 동시에 chunk commit을 회전시키므로 풀이 좁으면 직렬화된다.
    maximum-pool-size: ${RSI_DATA_DB_POOL_MAX:20}
    minimum-idle: ${RSI_DATA_DB_POOL_MIN_IDLE:5}
    connection-timeout: ${RSI_DATA_DB_CONNECTION_TIMEOUT:30000}
    leak-detection-threshold: ${RSI_DATA_DB_LEAK_DETECTION:60000}
    pool-name: DataDBPool
  datasource-meta:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${RSI_DB_USERNAME:dnltjdrn}
    password: ${RSI_DB_PASSWORD}
    jdbc-url: jdbc:mysql://${RSI_META_DB_HOST:mysql-meta}:${RSI_META_DB_PORT:3306}/RSIMeta
  batch:
    jdbc:
      initialize-schema: always
      schema: classpath:org/springframework/batch/core/schema-mysql.sql
    job:
      enabled: 'false'
  application:
    name: RSIranking
  data:
    redis:
      host: ${RSI_REDIS_HOST:redis}
      port: ${RSI_REDIS_PORT:6379}
      username: default
      password: ${RSI_REDIS_PASSWORD}
      timeout: 3000

scheduler:
  stockinfo:
    enabled: false
  dailytranding:
    enabled: false
  rsiproducer:
    enabled: false
  # RSI 계산 결과를 DB에 적재하는 리스너 — 캐치업/일일 배치 모두 이 컨슈머에 의존한다
  rsistreamlistener:
    enabled: true
  master:
    enabled: true
    # 일일 수집 시각 — 환경변수로 재배포 없이 변경 가능.
    # "전일" 데이터를 수집하므로 요일 범위에 주의: 18:30 MON-FRI는 화~금 실행분이 월~목 데이터를
    # 수집하고 금요일 데이터는 수집되지 않는다(월요일 실행분은 yesterday=일요일이라 스킵).
    # 금요일 데이터까지 스케줄러로 수집하려면 TUE-SAT 형태를 사용할 것 (예: "0 0 5 * * TUE-SAT").
    cron: "${SCHEDULER_MASTER_CRON:0 30 18 * * MON-FRI}"

# 기동 시 매매 정보 갭 자동 수집.
# 첫 배포(빈 DB)면 backfill-days 만큼 과거부터, 이후에는 마지막 수집일 다음 영업일부터 채운다.
bootstrap:
  catchup:
    enabled: ${RSI_BOOTSTRAP_ENABLED:true}
    backfill-days: 200
    lag-days: 1
    interval-ms: 200
    drain-secs: 15

server:
  port: '8080'

api:
  krx:
    kospi-info-url: "https://data-dbg.krx.co.kr/svc/apis/sto/stk_bydd_trd"
    kosdaq-info-url: "https://data-dbg.krx.co.kr/svc/apis/sto/ksq_isu_base_info"
    kospi-trading-info-url: "https://data-dbg.krx.co.kr/svc/apis/sto/stk_bydd_trd"
    kosdaq-trading-info-url: "https://data-dbg.krx.co.kr/svc/apis/sto/ksq_bydd_trd"
    key: ${KRX_API_KEY}
