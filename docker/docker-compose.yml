# 인프라: MySQL(meta/data) + Redis
# 사용법: docker compose -f docker/docker-compose.yml up -d
# 프로젝트명 고정 — 볼륨이 rsiranking_mysql_RSI_* 로 해석되어 기존 데이터를 유지한다.
name: rsiranking
services:
  mysql-meta:
    image: mysql:8.0  # 사용할 MySQL 버전 지정
    container_name: RSI-meta  # 컨테이너 이름 설정
    restart: always  # 컨테이너가 중지되면 자동 재시작
    environment:
      # 비밀번호는 같은 디렉터리의 .env 파일에서 주입 (.env.example 참고)
      MYSQL_ROOT_PASSWORD: ${MYSQL_META_ROOT_PASSWORD:?docker/.env 에 MYSQL_META_ROOT_PASSWORD 를 설정하세요}
      MYSQL_DATABASE: RSIMeta  # 생성할 기본 데이터베이스
      MYSQL_USER: ${RSI_DB_USERNAME:-dnltjdrn}  # 사용자 계정 생성
      MYSQL_PASSWORD: ${RSI_DB_PASSWORD:?docker/.env 에 RSI_DB_PASSWORD 를 설정하세요}
    ports:
      - "3307:3306"  # 호스트와 컨테이너 간 포트 매핑
    volumes:
      - mysql_RSI_meta:/var/lib/mysql  # 데이터 영속성을 위한 볼륨 설정
    networks:
      - rsi-network

  mysql-data:
    image: mysql:8.0  # 사용할 MySQL 버전 지정
    container_name: RSI-data  # 컨테이너 이름 설정
    restart: always  # 컨테이너가 중지되면 자동 재시작
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_DATA_ROOT_PASSWORD:?docker/.env 에 MYSQL_DATA_ROOT_PASSWORD 를 설정하세요}
      MYSQL_DATABASE: RSIData  # 생성할 기본 데이터베이스
      MYSQL_USER: ${RSI_DB_USERNAME:-dnltjdrn}  # 사용자 계정 생성
      MYSQL_PASSWORD: ${RSI_DB_PASSWORD:?docker/.env 에 RSI_DB_PASSWORD 를 설정하세요}
    ports:
      - "3308:3306"  # 호스트와 컨테이너 간 포트 매핑
    volumes:
      - mysql_RSI_data:/var/lib/mysql  # 데이터 영속성을 위한 볼륨 설정
    mem_limit: 2048m
    cpus: 2.0
    networks:
      - rsi-network

  redis:
    image: redis/redis-stack
    container_name: RSI-Redis
    restart: always
    command: [ "redis-server", "--requirepass", "${RSI_REDIS_PASSWORD:?docker/.env 에 RSI_REDIS_PASSWORD 를 설정하세요}" ]
    ports:
      - 6380:6379
    networks:
      - rsi-network

volumes:
  mysql_RSI_meta:
  mysql_RSI_data:

# 앱 컨테이너(docker-compose.app.yml)가 external 로 참조하는 고정 이름 네트워크.
# 인프라를 먼저 올리면 자동 생성된다.
networks:
  rsi-network:
    name: rsi-network
