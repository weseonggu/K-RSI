server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # api 는 compose 서비스명으로 해석된다.
    # 변수 + resolver 사용: 기동 시점이 아니라 요청 시점에 DNS를 조회하므로
    # api 컨테이너가 아직 없거나 재시작돼도 frontend 가 죽지 않는다.
    resolver 127.0.0.11 valid=10s;

    # REST API 프록시 — 앱은 /rsi/api/... 로 호출하고 백엔드의 /api/... 로 전달한다
    location /rsi/api/ {
        set $api_upstream http://api:8081;
        rewrite ^/rsi/api/(.*)$ /api/$1 break;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vue SPA — 빌드가 base=/rsi/ 이므로 /rsi/ 프리픽스를 벗겨 정적 파일에 매핑한다
    # (/rsi/ 자체는 index.html로 직행 — 일반 rewrite로 보내면 "/"의 302와 루프가 생긴다)
    location = /rsi/ {
        rewrite ^ /index.html last;
    }

    location /rsi/ {
        rewrite ^/rsi/(.*)$ /$1 last;
    }

    # 루트 접속은 /rsi/ 로 안내
    location = / {
        return 302 /rsi/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
